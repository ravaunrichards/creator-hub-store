services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: creatorhub_store
      POSTGRES_USER: creatorhub_store
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    volumes:
      - store_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhub_store -d creatorhub_store"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: postgres://creatorhub_store:${POSTGRES_PASSWORD:-change-this-local-password}@db:5432/creatorhub_store
      SESSION_SECRET: ${SESSION_SECRET:-change-this-development-secret-before-use-000000000000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPLOAD_DIR: /app/storage/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-150}
    ports:
      - "3000:3000"
    volumes:
      - store_uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  store_db:
  store_uploads:
